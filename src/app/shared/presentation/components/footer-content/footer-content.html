<footer class="fs-footer">
  <div class="fs-footer__inner">
    <span class="fs-footer__copyright">
      Copyright &copy; 2026 BitMeisters
    </span>

    <span class="fs-footer__sep">·</span>

    <span class="fs-footer__rights">
      {{ 'footer.rights' | translate }}
    </span>

    <span class="fs-footer__spacer"></span>

    <nav class="fs-footer__legal" [attr.aria-label]="'footer.legal-navigation' | translate">
      <a [href]="landingPageUrl + '/terms.html'" target="_blank" rel="noopener">{{ 'footer.terms' | translate }}</a>
      <a [href]="landingPageUrl + '/privacy.html'" target="_blank" rel="noopener">{{ 'footer.privacy' | translate }}</a>
    </nav>

    <span class="fs-footer__sep">·</span>

    <span class="fs-footer__powered">
      {{ 'footer.powered-by' | translate }}
      <a href="https://material.angular.dev/" target="_blank" rel="noopener">Angular Material</a>
      {{ 'footer.and' | translate }}
      <a href="https://ngx-translate.org/" target="_blank" rel="noopener">ngx-translate</a>
    </span>
  </div>
</footer>
