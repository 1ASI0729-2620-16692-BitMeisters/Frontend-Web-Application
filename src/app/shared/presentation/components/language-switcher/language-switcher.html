<mat-button-toggle-group [value]="currentLang"
                         appearance="standard"
                         [attr.aria-label]="'layout.preferredLanguage' | translate"
                         name="language">

  @for (language of languages; track language.code) {
    <mat-button-toggle [value]="language.code"
                       [aria-label]="language.name"
                       (click)="useLanguage(language.code)">
      {{ language.label }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
