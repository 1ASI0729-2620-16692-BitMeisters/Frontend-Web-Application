<mat-sidenav-container class="layout-container">

  <mat-sidenav class="sidebar" mode="side" opened>

    <div class="sidebar-header">
      <mat-icon class="sidebar-header__icon">verified_user</mat-icon>
      <div class="sidebar-header__text">
        <h2 class="sidebar-header__title">{{ 'app.title' | translate }}</h2>
        <span class="sidebar-header__subtitle">by BitMeisters</span>
      </div>
    </div>

    <nav class="sidebar-navigation">
      @for (option of options(); track option.label) {
        <a
          class="sidebar-link"
          [class.sidebar-link--core]="option.category === 'core'"
          [class.sidebar-link--support]="option.category === 'support'"
          [class.sidebar-link--generic]="option.category === 'generic'"
          mat-button
          [routerLink]="option.link"
          routerLinkActive="active">

          <mat-icon class="sidebar-link__icon">{{ option.icon }}</mat-icon>
          <span class="sidebar-link__label">{{ option.label | translate }}</span>

        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <mat-icon class="sidebar-footer__icon">info</mat-icon>
      <span class="sidebar-footer__version">v1.0.0</span>
    </div>

  </mat-sidenav>

  <mat-sidenav-content class="content-wrapper">

    <mat-toolbar class="topbar">

      <div class="topbar__brand">
        <mat-icon class="topbar__brand-icon">verified_user</mat-icon>
        <div class="topbar__brand-text">
          <span class="topbar__title">{{ 'app.title' | translate }}</span>
          <span class="topbar__subtitle">{{ 'app.tagline' | translate }}</span>
        </div>
      </div>

      <span class="mat-spacer"></span>

      <div class="topbar__actions">
        <app-language-switcher />
      </div>

    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>

    <app-footer-content />

  </mat-sidenav-content>

</mat-sidenav-container>
